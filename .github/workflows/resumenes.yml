# Resumen quincenal de entrenamiento con Claude en modo headless.
#
# Corre cada lunes; el script solo escribe a quien lleve 13 días o más sin
# resumen, así que a cada persona le llega uno cada dos semanas. Solo a quien lo
# haya activado en la app (Ajustes → Privacidad).
#
# Secrets que hay que crear (Settings → Secrets and variables → Actions → SECRETS,
# no Variables):
#   SUPABASE_DB_URL          postgresql://postgres.<ref>:<contraseña>@aws-0-eu-central-1.pooler.supabase.com:5432/postgres
#                            (la contraseña URL-encodeada)
#   CLAUDE_CODE_OAUTH_TOKEN  sale de `claude setup-token` (tira de tu suscripción)
#                            — o ANTHROPIC_API_KEY si prefieres pagar por uso.
#
# EL REPOSITORIO ES PÚBLICO y este registro también: el script solo imprime
# recuentos. No añadas pasos que vuelquen datos ni subas artefactos.
name: Resumen quincenal

on:
  schedule:
    - cron: "0 6 * * 1"      # lunes 06:00 UTC (07:00/08:00 en España)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resumenes
  cancel-in-progress: false

jobs:
  resumir:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm install -g @anthropic-ai/claude-code
      - run: node scripts/resumen-quincenal.mjs
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
