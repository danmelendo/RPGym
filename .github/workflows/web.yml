# Publica la versión WEB de RPGym en GitHub Pages.
#
# Para qué: quien tiene iPhone no puede instalar el APK, así que abre esta web
# desde Safari y la añade a la pantalla de inicio. Se comporta como una app.
#
# Las dos variables vienen de la configuración del repositorio
# (Settings -> Secrets and variables -> Actions -> Variables), no del código.
#
# Son PÚBLICAS por diseño —viajan dentro del APK y del bundle web, cualquiera
# puede leerlas— y lo que protege los datos es la RLS de Supabase, no esconder
# la anon key. Aun así no se escriben aquí: una anon key es un JWT y los
# escáneres de secretos (GitGuardian y compañía) la marcan como filtración,
# con razón, porque no pueden saber que es la pública. Fuera del código, fuera
# del ruido. Un secreto de verdad iría en Secrets, nunca en Variables.
name: Publicar la web

on:
  push:
    branches: [main]
  workflow_dispatch:        # y a mano desde la pestaña Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
