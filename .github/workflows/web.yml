# Publica la versión WEB de RPGym en GitHub Pages.
#
# Para qué: quien tiene iPhone no puede instalar el APK, así que abre esta web
# desde Safari y la añade a la pantalla de inicio. Se comporta como una app.
#
# Las dos variables de abajo SON PÚBLICAS por diseño: viajan dentro del APK que
# ya se reparte y cualquiera puede leerlas. Lo que protege los datos es la RLS
# de Supabase, no esconder la anon key. Un secreto de verdad (la service role o
# la clave de Firebase) NUNCA iría aquí.
name: Publicar la web

on:
  push:
    branches: [main]
  workflow_dispatch:        # y a mano desde la pestaña Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://svmxsnvjjddxgolkjwjb.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN2bXhzbnZqamRkeGdvbGtqd2piIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2NjA4ODMsImV4cCI6MjEwMzIzNjg4M30.2nq1vzXHFi4uvl7Ghnof6VOIpk65FHCcbMkRgoGiEuU
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
