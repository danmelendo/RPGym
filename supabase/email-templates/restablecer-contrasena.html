<!-- Supabase → Authentication → Email Templates → "Reset password"
     Asunto sugerido:  Tu código para cambiar la contraseña
     Igual que el de registro: código, no enlace. -->
<div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;max-width:520px;margin:0 auto;padding:8px">

  <div style="font-size:22px;font-weight:700;letter-spacing:.02em;color:#1a1a1a;margin-bottom:4px">RPGym</div>
  <div style="font-size:13px;color:#777;margin-bottom:24px">Tu gimnasio, convertido en juego</div>

  <h1 style="font-size:19px;color:#1a1a1a;margin:0 0 14px">Cambiar tu contraseña</h1>

  <p style="font-size:15px;line-height:1.55;color:#333;margin:0 0 22px">
    Escribe este código en la app para poder elegir una contraseña nueva.
  </p>

  <div style="text-align:center;background:#faf7f0;border:1px solid #e6ddc9;border-radius:12px;padding:22px 16px;margin:0 0 22px">
    <div style="font-size:12px;color:#8a8272;letter-spacing:.1em;font-weight:700;margin-bottom:8px">TU CÓDIGO</div>
    <div style="font-family:'SFMono-Regular',Menlo,Consolas,monospace;font-size:34px;font-weight:700;color:#B8862B;letter-spacing:.22em">{{ .Token }}</div>
  </div>

  <p style="font-size:13px;line-height:1.5;color:#777;margin:0">
    Caduca en una hora. No se lo pases a nadie.
  </p>

  <hr style="border:none;border-top:1px solid #e5e5e5;margin:24px 0">

  <p style="font-size:12px;line-height:1.5;color:#999;margin:0">
    Si no has pedido cambiarla, ignora este correo: tu contraseña seguirá siendo la misma.
  </p>
</div>
